$("cs").onclick=()=>{const c="\ufeffname,class,test,score,percent,seconds,lang,date,answers\n"+r.map(x=>[x.name,x.cls,tl(x.test),x.score,x.pct,x.spent,x.lang,new Date(x.ts).toISOString(),x.answers].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");const u=URL.createObjectURL(new Blob([c],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="results.csv";l.click();URL.revokeObjectURL(u)}}
langBar();draw();
</script></body></html>
